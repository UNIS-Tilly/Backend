spring:
  application:
    name: tilly-backend
  jackson:
    time-zone: Asia/Seoul
  datasource:
    # TODO(NOTICE-014): MySQL 접속 정보 필요 (.env에 값 입력)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    # TODO(NOTICE-032): Redis 접속 정보 필요 (.env에 값 입력)
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

jwt:
  # TODO(NOTICE-039): JWT 서명 키 필요 (.env의 JWT_SECRET, HS256 기준 최소 32바이트)
  secret: ${JWT_SECRET}

google:
  # TODO(NOTICE-015): 구글 OAuth 클라이언트 정보 필요 (.env의 GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET)
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  # TODO(NOTICE-015): 구글 콘솔에 등록한 Redirect URI와 정확히 같은 값이어야 함 (.env의 GOOGLE_REDIRECT_URI)
  redirect-uri: ${GOOGLE_REDIRECT_URI}

# Refresh Token 쿠키 속성. local 프로파일에서는 http로도 테스트할 수 있게 완화한다 (아래 local 블록에서 재정의).
app:
  cookie:
    secure: true
    same-site: None

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local

app:
  cookie:
    secure: false
    same-site: Lax
