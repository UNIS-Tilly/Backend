# 프로젝트 이름을 명시한다. 지정하지 않으면 Compose가 폴더 이름(Backend)으로 프로젝트 이름을 잡는데,
# 다른 프로젝트도 폴더 이름이 "Backend"이면 컨테이너가 서로 겹쳐 재생성(덮어쓰기)되는 사고가 날 수 있다.
name: tilly-backend

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # TODO(NOTICE-014): MySQL 접속 정보 필요 — 아래 변수를 .env에 채운 뒤 실행
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - tilly_mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # TODO(NOTICE-032): Redis 접속 정보 필요 — 아래 변수를 .env에 채운 뒤 실행
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tilly_redis_data:/data

volumes:
  tilly_mysql_data:
  tilly_redis_data:
